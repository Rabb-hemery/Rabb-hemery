<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Rewrite — Projects</title>
  <desc id="desc">Dark cyan and violet terminal-inspired project dashboard for Rewrite_OS, budget-app-react, and Guess-The-Number.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1b"/><stop offset="1" stop-color="#0d1025"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.muted{fill:#8491ad}.white{fill:#e8efff}.cyan{fill:#67e8f9}.violet{fill:#c4b5fd}.card{fill:#0c1426;stroke:#1e3a55;stroke-width:1}.small{font-size:11px}.title{font-size:18px;font-weight:700}.desc{font-size:12px}
    </style>
  </defs>
  <rect width="1000" height="450" rx="18" fill="url(#bg)"/><path d="M0 1H1000" stroke="url(#accent)" stroke-width="3"/>
  <text x="28" y="35" class="mono cyan" font-size="13" letter-spacing="2">PROJECTS.LIST</text><text x="190" y="35" class="mono muted" font-size="11">./projects.sh --all</text>
  <circle cx="948" cy="30" r="4" fill="#22d3ee" filter="url(#glow)"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="965" y="34" text-anchor="end" class="mono muted" font-size="10">REWRITE</text>
  <rect x="20" y="55" width="470" height="175" rx="12" class="card"/><path d="M20 67Q20 55 32 55H478Q490 55 490 67" fill="none" stroke="#22d3ee" stroke-opacity=".65"/>
  <text x="38" y="78" class="mono muted small">01 / Rabb-hemery/Rewrite_Os</text><circle cx="466" cy="73" r="3" fill="#22d3ee"/>
  <rect x="38" y="94" width="42" height="42" rx="9" fill="#102a40" stroke="#22d3ee" stroke-opacity=".8"/><text x="59" y="121" text-anchor="middle" class="mono cyan" font-size="20" font-weight="700">R_</text>
  <text x="94" y="111" class="mono white title">Rewrite_OS</text><text x="94" y="131" class="mono muted desc">Building an OS from scratch</text>
  <text x="38" y="158" class="mono muted desc">Bootloader · Kernel · Memory · Basic shell</text>
  <rect x="38" y="177" width="50" height="20" rx="10" fill="#312e81" stroke="#8b5cf6" stroke-opacity=".7"/><text x="63" y="190" text-anchor="middle" class="mono violet small">C</text>
  <rect x="96" y="177" width="120" height="20" rx="10" fill="#123047" stroke="#22d3ee" stroke-opacity=".5"/><text x="156" y="190" text-anchor="middle" class="mono cyan small">OS DEVELOPMENT</text><text x="38" y="216" class="mono muted small">Explore repository →</text>
  <rect x="510" y="55" width="470" height="175" rx="12" class="card"/><path d="M510 67Q510 55 522 55H968Q980 55 980 67" fill="none" stroke="#a78bfa" stroke-opacity=".75"/>
  <text x="528" y="78" class="mono muted small">02 / Rabb-hemery/budget-app-react</text><circle cx="956" cy="73" r="3" fill="#a78bfa"/>
  <rect x="528" y="94" width="42" height="42" rx="9" fill="#251d46" stroke="#a78bfa" stroke-opacity=".8"/><text x="549" y="121" text-anchor="middle" class="mono violet" font-size="19" font-weight="700">$</text>
  <text x="584" y="111" class="mono white title">budget-app-react</text><text x="584" y="131" class="mono muted desc">React/Vite budget tracker</text>
  <text x="528" y="158" class="mono muted desc">Income · Expenses · Budgets · Monthly summary</text>
  <rect x="528" y="177" width="86" height="20" rx="10" fill="#312e81" stroke="#8b5cf6" stroke-opacity=".7"/><text x="571" y="190" text-anchor="middle" class="mono violet small">JavaScript</text>
  <rect x="622" y="177" width="55" height="20" rx="10" fill="#123047" stroke="#22d3ee" stroke-opacity=".5"/><text x="649" y="190" text-anchor="middle" class="mono cyan small">React</text><text x="528" y="216" class="mono muted small">Explore repository →</text>
  <rect x="20" y="250" width="470" height="175" rx="12" class="card"/><path d="M20 262Q20 250 32 250H478Q490 250 490 262" fill="none" stroke="#22d3ee" stroke-opacity=".65"/>
  <text x="38" y="273" class="mono muted small">03 / Rabb-hemery/Guess-The-Number</text><circle cx="466" cy="268" r="3" fill="#22d3ee"/>
  <rect x="38" y="289" width="42" height="42" rx="9" fill="#102a40" stroke="#22d3ee" stroke-opacity=".8"/><text x="59" y="316" text-anchor="middle" class="mono cyan" font-size="19" font-weight="700">?</text>
  <text x="94" y="306" class="mono white title">Guess-The-Number</text><text x="94" y="326" class="mono muted desc">Bash terminal guessing game</text>
  <text x="38" y="353" class="mono muted desc">PostgreSQL database · Player statistics</text>
  <rect x="38" y="372" width="48" height="20" rx="10" fill="#123047" stroke="#22d3ee" stroke-opacity=".5"/><text x="62" y="385" text-anchor="middle" class="mono cyan small">Bash</text>
  <rect x="94" y="372" width="90" height="20" rx="10" fill="#312e81" stroke="#8b5cf6" stroke-opacity=".7"/><text x="139" y="385" text-anchor="middle" class="mono violet small">PostgreSQL</text><text x="38" y="411" class="mono muted small">Explore repository →</text>
  <rect x="510" y="250" width="470" height="175" rx="12" fill="#0a1121" stroke="#26304e"/>
  <text x="532" y="279" class="mono cyan" font-size="12">SYSTEM NOTE</text><text x="532" y="309" class="mono white" font-size="15">Learn. Build. Break. Rebuild.</text>
  <text x="532" y="337" class="mono muted desc">A work-in-progress portfolio of systems,</text><text x="532" y="356" class="mono muted desc">software and hands-on learning projects.</text>
  <path d="M532 378H950" stroke="#26304e"/><text x="532" y="401" class="mono violet small">STATUS: PROJECTS INDEX READY</text>
  <rect x="910" y="391" width="40" height="4" rx="2" fill="#26304e"/><rect x="910" y="391" width="28" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" values="10;28;10" dur="3s" repeatCount="indefinite"/></rect>
</svg>
